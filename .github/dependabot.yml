# Grouped into one PR per ecosystem per week. A status page with four
# dependencies does not need a pull request per patch bump, and a single PR
# that CI has already run against is easier to judge than five.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # A conventional title, which release-please reads once it is squash-
    # merged. hono, yaml and zod are bundled into every deployment's Worker
    # and wrangler is what builds it, so a bump here is a patch release.
    commit-message:
      prefix: "fix(deps)"
    # pnpm refuses a package younger than a day, so a PR for a release that
    # came out this morning fails CI for no reason. Two days clears it.
    cooldown:
      default-days: 2
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @cloudflare/vitest-pool-workers runs the tests inside workerd and
      # supports vitest ^4.1 only; vitest 5 fails at load. Lift this when the
      # pool's peer range takes 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
