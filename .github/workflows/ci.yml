name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # status.yaml references secrets by name only; any value proves the shape.
      # If your config uses more `${VAR}`s than these, add them here — the lint
      # names the one it could not resolve, so a red build tells you which.
      - run: pnpm lint:config
        env:
          NTFY_URL: https://ntfy.example/ci
          HEARTBEAT_TOKEN: ci
      - run: pnpm test

  # The package as a deployment gets it: packed, installed into a fresh copy of
  # the template with npm, and run through that deployment's own check.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:template
