# Pull requests are squash-merged, so the title becomes the commit
# release-please reads: it decides whether a merge releases anything and how
# big the version bump is. This keeps titles in that shape.
#
#   fix: …        patch release
#   feat: …       minor release
#   feat!: …      major release — anything a deployment has to act on
#   chore: / docs: / ci: / test: / refactor:   no release
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
