# Releases are cut by release-please from conventional commit messages.
#
# Every push to main updates a "chore(main): release x.y.z" pull request that
# bumps both packages and writes CHANGELOG.md from the commits since the last
# release: `fix:` is a patch, `feat:` a minor, and `feat!:` or a
# `BREAKING CHANGE:` footer a major. Merging that pull request tags the
# release, creates the GitHub Release, and runs `publish` below.
#
# Semver is a promise to deployments here: minor and patch releases merge into
# every status page with nobody looking, and a major waits for a human. So
# anything an operator has to do by hand is `!`, with what to do in the body.
#
# Publishing lives in this file rather than a tag-triggered one because a tag
# pushed with the built-in token does not trigger other workflows, and because
# npm trusted publishing (OIDC, no npm token) names this file as the publisher
# of both packages. For the same token reason the release pull request shows
# no CI checks; `publish` runs them all before anything reaches npm.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # create-uptime pins the package exactly. release-please bumps both, and
      # this proves it did before either is published.
      - name: Both packages are on one version
        run: |
          set -euo pipefail
          v="$(jq -r .version package.json)"
          for got in \
            "$(jq -r .version packages/create-uptime/package.json)" \
            "$(jq -r '.dependencies["@joshghent/uptime"]' packages/create-uptime/package.json)"; do
            if [ "$got" != "$v" ]; then
              echo "::error::create-uptime says $got, the package is $v"
              exit 1
            fi
          done

      - run: pnpm typecheck
      - run: pnpm lint:config
        env:
          NTFY_URL: https://ntfy.example/ci
          HEARTBEAT_TOKEN: ci
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:template

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      # The package first: create-uptime pins it, so it has to exist. A version
      # already on npm is skipped rather than failed, so a run that stopped
      # halfway can be re-run to finish.
      - name: Publish to npm
        run: |
          set -euo pipefail
          for dir in . packages/create-uptime; do
            id="$(jq -r '.name + "@" + .version' "$dir/package.json")"
            if npm view "$id" version >/dev/null 2>&1; then
              echo "$id is already on npm"
              continue
            fi
            (cd "$dir" && npm publish --access public)
          done
