# Keeps your fork up to date with upstream, once a week. It opens a pull
# request, waits for your own CI to pass on it — against your own status.yaml —
# and merges it, which deploys. You only hear about an update when it needs
# you: a release marked **Action required** in CHANGELOG.md (a migration, a new
# secret), a merge conflict, or a red build. Those stay open for you to finish.
#
# To review every update yourself instead, set the repository variable
# SYNC_AUTO_MERGE to "false" (Settings > Secrets and variables > Actions >
# Variables) and it will only open the pull request.
#
# It never runs on the upstream repository itself.
#
# This needs a personal access token in the SYNC_TOKEN secret. Not optional:
# the built-in GITHUB_TOKEN is refused when a push touches anything under
# .github/workflows/, and upstream releases do change workflows. No
# `permissions:` scope grants it — the only way round is a token of your own.
# A token also sidesteps the account-level restriction on Actions opening
# pull requests, so it solves both problems at once.
#
#   github.com/settings/personal-access-tokens > Generate new token
#     Repository access: only this fork
#     Contents: read and write
#     Pull requests: read and write
#     Workflows: read and write
#   then: gh secret set SYNC_TOKEN -R <you>/<your-fork>
# GitHub also disables scheduled workflows in a fork until you enable Actions
# on the Actions tab, and pauses them again after 60 days without activity.
#
# Prefer to do it by hand? That works too, and needs no settings at all:
#   git remote add upstream https://github.com/joshghent/uptime.git
#   git fetch upstream && git merge upstream/main
name: Sync from upstream

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'joshghent/uptime'
    runs-on: ubuntu-latest
    # Most of this is waiting for your CI on the sync PR.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN so the job still runs without a token;
          # it just cannot carry a workflow change, and says so when it hits one.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream and open a PR
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/joshghent/uptime.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git checkout -B upstream-sync

          # A conflict means a file you changed also changed upstream. That
          # needs a human, so fail loudly rather than push a broken branch.
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::upstream/main conflicts with this fork. Merge it locally: git fetch upstream && git merge upstream/main"
            exit 1
          fi

          if ! git push --force-with-lease origin upstream-sync 2>push-error.txt; then
            cat push-error.txt
            if grep -q "workflows. permission" push-error.txt; then
              echo "::error::This update changes a workflow file, which the built-in token is not allowed to push. Set a SYNC_TOKEN secret with Workflows write permission — see the header of this file — or merge by hand: git fetch upstream && git merge upstream/main"
            fi
            exit 1
          fi

          # An already-open PR is the one benign failure here. Anything else —
          # most often the account-level "create and approve pull requests"
          # setting being off — has to fail the job, or a sync that never
          # happened looks exactly like a sync with nothing to do.
          if gh pr create \
            --base "$BASE" \
            --head upstream-sync \
            --title "Sync from upstream" \
            --body "Brings this fork up to date with [joshghent/uptime](https://github.com/joshghent/uptime). Read the release notes for anything marked **Action required** — a release that adds a migration needs \`pnpm run db:migrate\` as well. Merging deploys." \
            2>pr-error.txt; then
            echo "Opened a sync PR."
          elif grep -qi "already exists" pr-error.txt; then
            echo "A sync PR is already open; its branch has been updated."
          elif [ "$HAS_TOKEN" != "true" ]; then
            cat pr-error.txt
            echo "::error::Could not open the sync PR because this fork has no SYNC_TOKEN secret, and the built-in token is not allowed to. Create one as described at the top of .github/workflows/upstream-sync.yml, then run this workflow again from the Actions tab."
            exit 1
          else
            cat pr-error.txt
            echo "::error::Could not open the sync PR. The upstream-sync branch is pushed, so you can open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/$BASE...upstream-sync — if the message above says \"Resource not accessible by integration\", turn on \"Allow GitHub Actions to create and approve pull requests\" in BOTH your account settings (github.com/settings/actions) and this repository's Settings > Actions > General."
            exit 1
          fi
          echo "pr=open" >> "$GITHUB_OUTPUT"

      # Merges only what a release says is safe to merge unattended, and only
      # once your own checks agree. A PR made with SYNC_TOKEN triggers your CI
      # like any other; one made with the built-in token would not, which is
      # one more reason the token is required.
      - name: Merge the sync PR once your CI passes
        if: steps.sync.outputs.pr == 'open' && vars.SYNC_AUTO_MERGE != 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BEFORE: ${{ steps.sync.outputs.before }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Not merging: automatic updates need a SYNC_TOKEN secret. The PR is open for you to merge."
            exit 0
          fi

          if git diff "$BEFORE" upstream-sync -- CHANGELOG.md | grep '^+' | grep -q '\*\*Action required'; then
            gh pr comment upstream-sync --body "Not merged automatically: this update includes a release marked **Action required**. Do what its CHANGELOG entry says, then merge — merging deploys."
            echo "::notice::Left open: a release in this update is marked Action required."
            exit 0
          fi

          # Checks appear a few seconds after the push. None at all within five
          # minutes means CI is not running on this fork, and nothing has
          # vouched for the update — so it is not merged.
          count=0
          for _ in $(seq 1 30); do
            count=$(gh pr checks upstream-sync --json name --jq length 2>/dev/null || echo 0)
            [ "$count" -gt 0 ] && break
            sleep 10
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No checks ran on the sync PR, so it was not merged. Enable Actions for this fork (Actions tab), or merge the PR by hand."
            exit 1
          fi

          if ! gh pr checks upstream-sync --watch --fail-fast --interval 20; then
            echo "::error::Your CI failed on the sync PR, so it was not merged. The PR is open with the failing check."
            exit 1
          fi

          gh pr merge upstream-sync --merge --delete-branch
          echo "Merged — your deploy runs from here."
