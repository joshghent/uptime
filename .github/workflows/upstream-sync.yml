# Opens a pull request bringing your fork up to date with upstream, once a
# week. Your CI runs on that PR, so you see the checks pass against your own
# status.yaml before you merge — and merging is what deploys.
#
# It never runs on the upstream repository itself.
#
# This needs a personal access token in the SYNC_TOKEN secret. Not optional:
# the built-in GITHUB_TOKEN is refused when a push touches anything under
# .github/workflows/, and upstream releases do change workflows. No
# `permissions:` scope grants it — the only way round is a token of your own.
# A token also sidesteps the account-level restriction on Actions opening
# pull requests, so it solves both problems at once.
#
#   github.com/settings/personal-access-tokens > Generate new token
#     Repository access: only this fork
#     Contents: read and write
#     Pull requests: read and write
#     Workflows: read and write
#   then: gh secret set SYNC_TOKEN -R <you>/<your-fork>
# GitHub also disables scheduled workflows in a fork until you enable Actions
# on the Actions tab, and pauses them again after 60 days without activity.
#
# Prefer to do it by hand? That works too, and needs no settings at all:
#   git remote add upstream https://github.com/joshghent/uptime.git
#   git fetch upstream && git merge upstream/main
name: Sync from upstream

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'joshghent/uptime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN so the job still runs without a token;
          # it just cannot carry a workflow change, and says so when it hits one.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream and open a PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          HAS_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/joshghent/uptime.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          git checkout -B upstream-sync

          # A conflict means a file you changed also changed upstream. That
          # needs a human, so fail loudly rather than push a broken branch.
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::upstream/main conflicts with this fork. Merge it locally: git fetch upstream && git merge upstream/main"
            exit 1
          fi

          if ! git push --force-with-lease origin upstream-sync 2>push-error.txt; then
            cat push-error.txt
            if grep -q "workflows. permission" push-error.txt; then
              echo "::error::This update changes a workflow file, which the built-in token is not allowed to push. Set a SYNC_TOKEN secret with Workflows write permission — see the header of this file — or merge by hand: git fetch upstream && git merge upstream/main"
            fi
            exit 1
          fi

          # An already-open PR is the one benign failure here. Anything else —
          # most often the account-level "create and approve pull requests"
          # setting being off — has to fail the job, or a sync that never
          # happened looks exactly like a sync with nothing to do.
          if gh pr create \
            --base "$BASE" \
            --head upstream-sync \
            --title "Sync from upstream" \
            --body "Brings this fork up to date with [joshghent/uptime](https://github.com/joshghent/uptime). Read the release notes for anything marked **Action required** — a release that adds a migration needs \`pnpm run db:migrate\` as well. Merging deploys." \
            2>pr-error.txt; then
            echo "Opened a sync PR."
          elif grep -qi "already exists" pr-error.txt; then
            echo "A sync PR is already open; its branch has been updated."
          else
            cat pr-error.txt
            echo "::error::Could not open the sync PR. The upstream-sync branch is pushed, so you can open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/$BASE...upstream-sync — if the message above says \"Resource not accessible by integration\", turn on \"Allow GitHub Actions to create and approve pull requests\" in BOTH your account settings (github.com/settings/actions) and this repository's Settings > Actions > General."
            exit 1
          fi
