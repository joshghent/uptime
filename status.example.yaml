# Your status page, in one file.
#
#   cp status.example.yaml status.yaml   copy this once, then edit the copy
#   pnpm lint:config                     check it
#   pnpm run deploy                      publish the change
#
# `status.yaml` is yours: it is not tracked upstream, so pulling updates never
# touches it. Commit it to your own fork — the deploy bundles it.
#
# Every `${VAR}` below is read from a Worker secret:
#   npx wrangler secret put NTFY_URL
# and from `.dev.vars` when you run locally.

title: Acme Status
description: Live availability for everything we run.
link: https://acme.com

# Days of raw check results to keep. The 90-day bars come from daily rollups,
# so this only bounds the recent-window alarm rules.
retain_days: 7

# Applied to every monitor unless the monitor overrides it.
#
# 1m + 2 consecutive failures means an outage alerts within ~2 minutes, which
# is as fast as this can go — Cloudflare's cron floor is one minute. Alarming
# on a single failure would page you for every transient blip.
defaults:
  interval: 1m
  timeout: 10s
  expect_status: 2xx
  failures_before_alarm: 2

# Where alerts go. Either key can be a bare URL or { url, headers }.
notify:
  ntfy: ${NTFY_URL}
  # webhook:
  #   url: ${WEBHOOK_URL}
  #   headers:
  #     x-signature: ${WEBHOOK_SECRET}

monitors:
  - name: Website
    url: https://acme.com
    description: Marketing site and checkout

  - name: API
    url: https://api.acme.com/health
    description: API and database
    # Checking the body rather than just the status means a health endpoint
    # that returns 200 while its database is down still counts as a failure.
    expect_body: '"status":"ok"'
    degraded_ms: 1500

  # Point one monitor at this status page's own /health. It returns 503 when
  # the database has migrations left to apply, so an update you deployed but
  # never migrated raises an incident instead of going unnoticed.
  - name: Status page
    url: https://status.acme.com/health
    description: This page and its database
    expect_body: '"status":"ok"'

  # A heartbeat monitor has no URL. The job calls
  #   https://status.acme.com/ping/nightly-backup?token=...
  # when it finishes, and goes into alarm when a ping does not arrive in time.
  # Until the first ping arrives this monitor records nothing and never alerts,
  # so it is safe to leave here while the cron is being wired up.
  - name: Nightly backup
    type: heartbeat
    id: nightly-backup
    description: Database backup cron
    period: 24h
    grace: 2h
    token: ${HEARTBEAT_TOKEN}
