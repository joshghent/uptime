# Your status page, in one file.
#
#   pnpm lint:config    check this file
#   pnpm run deploy     publish the change
#
# Every `${VAR}` below is read from a Worker secret:
#   npx wrangler secret put NTFY_URL

title: Turbo Technologies Status
description: Live availability for Plan Pacer, RepoWarden and LoginLlama.
link: https://turbotechnologies.co.uk

# Days of raw check results to keep. The 90-day bars come from daily rollups,
# so this only bounds the recent-window alarm rules.
retain_days: 7

# Applied to every monitor unless the monitor overrides it.
defaults:
  interval: 5m
  timeout: 10s
  expect_status: 2xx
  failures_before_alarm: 2

# Where alerts go. Either key can be a bare URL or { url, headers }.
notify:
  ntfy: ${NTFY_URL}
  # webhook:
  #   url: ${WEBHOOK_URL}
  #   headers:
  #     x-signature: ${WEBHOOK_SECRET}

monitors:
  - name: Plan Pacer
    url: https://planpacer.com
    description: Marketing site and checkout

  - name: Plan Pacer API
    url: https://planpacer.com/api/health
    description: API and database
    # The endpoint reports on its D1 connection, so this checks the database
    # too rather than just that the Worker is up.
    expect_body: '"database":"connected"'
    degraded_ms: 1500
    failing_for: 5m

  - name: RepoWarden
    url: https://repowarden.dev
    description: Web app

  - name: RepoWarden API
    url: https://api.repowarden.dev/api/health
    description: API workers
    expect_body: '"status":"ok"'
    degraded_ms: 1500
    failing_for: 5m

  - name: LoginLlama
    url: https://loginllama.app
    description: Web app and dashboard

  - name: LoginLlama API
    url: https://loginllama.app/api/health
    description: Login-check API
    expect_body: '"status":"ok"'
    degraded_ms: 1500
    failing_for: 5m

  # A heartbeat monitor has no URL. The job calls
  #   https://uptime.<subdomain>.workers.dev/ping/repowarden-daily-scan?token=...
  # when it finishes, and goes into alarm when a ping does not arrive in time.
  # Until the first ping arrives this monitor records nothing and never alerts,
  # so it is safe to leave here while the cron is being wired up.
  - name: RepoWarden daily scan
    type: heartbeat
    id: repowarden-daily-scan
    description: Nightly repository scan cron
    period: 24h
    grace: 2h
    token: ${HEARTBEAT_TOKEN}
