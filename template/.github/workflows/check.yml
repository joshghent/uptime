# Runs on every pull request and push. On an update from Dependabot it also
# merges the pull request once the check passes, which is what deploys it.
#
# No tokens or settings: the merge uses the token GitHub gives every run, and
# nothing here runs on a schedule, so it never pauses for inactivity.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validates status.yaml, builds, then boots the Worker and loads it.
      # Secrets are not needed; unset ones get placeholders.
      - run: npm run check

  # Minor and patch releases only. A major means the release notes have
  # something marked "Action required", so it waits for you.
  merge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: update
        uses: dependabot/fetch-metadata@v2
      - if: steps.update.outputs.dependency-names == '@joshghent/uptime' && steps.update.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
